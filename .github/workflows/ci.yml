name: CI

# Run on every push to main and every pull request.
# Publishing is handled separately by release.yml on v* tags.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Package (smoke-test the vsix)
        run: npm run package

      - name: Upload vsix artifact
        uses: actions/upload-artifact@v4
        with:
          name: spatial-3d-file-explorer-vsix
          path: spatial-3d-file-explorer.vsix
          retention-days: 7
